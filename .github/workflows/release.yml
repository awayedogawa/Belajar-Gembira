name: Release APK

# Membuat GitHub Release berisi APK saat sebuah tag versi (mis. v1.3.0) di-push.
# Cara rilis: git tag v1.3.0 && git push origin v1.3.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Ganti nama APK sesuai tag
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/BelajarGembira-${GITHUB_REF_NAME}.apk"
          ls -lh release/

      - name: Buat GitHub Release + lampirkan APK
        uses: softprops/action-gh-release@v2
        with:
          name: "Belajar Gembira ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/BelajarGembira-${{ github.ref_name }}.apk
